name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, x86]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag e versão do app precisam bater
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$app" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != versão $app"; exit 1; }

      - id: build
        uses: ./.github/actions/build-win7
        with:
          arch: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: ${{ steps.build.outputs.bundle-dir }}/*-setup.exe*

  # Só publica depois que AS DUAS arquiteturas passaram no build e no win7-check,
  # para o latest.json nunca apontar para um instalador inexistente.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Montar latest.json
        run: |
          node scripts/make-latest-json.mjs \
            --version "${GITHUB_REF_NAME}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --out release \
            --x64 artifacts/bundle-x64 \
            --x86 artifacts/bundle-x86
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
